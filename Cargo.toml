[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
ahash = "=0.8.11"
bytes = "=1.12.2"
memchr = "=2.7.4"
memmap2 = "=0.9.5"
parquet = { version = "=55.2.0", default-features = false, features = ["snap"] }
rayon = "=1.10.0"
serde_json = "=1.0.140"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
